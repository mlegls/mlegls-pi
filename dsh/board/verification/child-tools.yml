# Add child-spawn and job-control tools to the verifier's selected custom preset.
- id: preset-hashline
  config:
    id: hashline
    name: Hashline
    description: Hashline read/edit/write, ast-grep transform, grep and sandboxed shell, plus session scratch tools through run_code.
    plugins:
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: ptc
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-subagent
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: one-shot
