# Skim owns result retention; do not truncate its originals before filtering.
- id: spill-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-str-replace-editor
  disabled: true
# Use a dedicated preset rather than inheriting stock fs registrations.
- id: tools
  config:
    mode: ptc
- id: fs-observation-policy
  disabled: true
- id: compaction-basic
  disabled: true
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: tool-fs-search
  disabled: false
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: hashline
- insert:
    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'
    - id: skim
      name: './dist/skim.js'
    - id: hashline
      name: './dist/hashline.js'
    - id: transform
      name: './dist/transform.js'
    - id: scratch
      name: './dist/scratch.js'
    - id: memory
      name: './dist/memory.js'
      config:
        headroomTokens: 8192
        maxTokens: 8192
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
    - id: board
      name: './dist/board.js'
    - id: preset-hashline
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hashline
        name: Hashline
        description: Hashline read/edit/write, ast-grep transform, grep and sandboxed shell, plus session scratch tools through run_code.
        plugins:
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
